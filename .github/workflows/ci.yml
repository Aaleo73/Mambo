name: 构建与测试
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: 获取并校验 libmpv
        shell: pwsh
        run: ./scripts/fetch-libmpv.ps1
      - name: 校验离线着色器
        shell: pwsh
        run: ./scripts/build-video-shaders.ps1 -Verify
      - name: 还原锁定依赖
        run: dotnet restore -p:Platform=x64 --locked-mode
      - name: 构建
        run: dotnet build -p:Platform=x64 --no-restore
      - name: 测试
        run: dotnet test --no-build --no-restore
