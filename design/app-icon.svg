<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Mambo 应用图标：蓝色圆角方块 + 播放三角 + 两道回声弧线。 -->
  <defs>
    <linearGradient id="bg" x1=".12" y1=".04" x2=".88" y2=".96">
      <stop offset="0" stop-color="#3fa0f2"/>
      <stop offset=".52" stop-color="#0c68b8"/>
      <stop offset="1" stop-color="#083f7a"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".32"/>
      <stop offset=".48" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7ebff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#03274d" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="54" fill="url(#bg)"/>
  <rect x="16" y="16" width="224" height="224" rx="54" fill="url(#gloss)"/>
  <rect x="16.5" y="16.5" width="223" height="223" rx="53.5" fill="none" stroke="#ffffff" stroke-opacity=".2"/>
  <g filter="url(#shadow)" stroke-linecap="round" fill="none">
    <path d="M158.1 101.3A36 36 0 0 1 158.1 154.7" stroke="#c4e5ff" stroke-opacity=".95" stroke-width="14"/>
    <path d="M174.1 83.4A60 60 0 0 1 174.1 172.6" stroke="#c4e5ff" stroke-opacity=".55" stroke-width="12"/>
    <path d="M60 88Q60 74 72.1 81.1L139.9 120.9Q152 128 139.9 135.1L72.1 174.9Q60 182 60 168Z" fill="url(#tri)" stroke="none"/>
  </g>
</svg>
